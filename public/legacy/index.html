<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#021a2e">
  <title>Tula's Island · Letter Bay</title>
  <style>
    html,body{margin:0;min-height:100%;background:#021a2e;color:#fff8e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .loading{min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div class="loading">Letter Bay wird geladen …</div>
  <script>
    (async()=>{
      try{
        const VERSION='20260820-compact-mobile-v1';
        const firstBoss=`assets/bosses/level-01-pirat-kai.png?v=${VERSION}`;
        let html=await fetch(`./source.html?v=${VERSION}`,{cache:'no-store'}).then(response=>{
          if(!response.ok)throw new Error(`source.html: ${response.status}`);
          return response.text();
        });

        // The old sprite sheet was both fragile and incorrectly transported as text.
        // Remove every legacy reference before the game document is parsed.
        html=html
          .replaceAll('/tulasisland/letter-bay/bosses/level-01-pirat-kai.webp',firstBoss)
          .replaceAll('boss-sprite-dropbox-v2.webp',firstBoss)
          .replaceAll('boss-sprite-dropbox.webp',firstBoss)
          .replaceAll('boss-sprite.avif',firstBoss)
          .replace(
            '<div class="fighter boss-art" id="bossArt" role="img"></div>',
            `<div class="fighter boss-art" id="bossArt" role="img"><img class="letter-bay-boss-image" src="${firstBoss}" alt="Pirat Kai"></div>`
          )
          .replace(
            '<div class="boss-art" id="introArt"></div>',
            `<div class="boss-art" id="introArt"><img class="letter-bay-boss-image" src="${firstBoss}" alt="Pirat Kai"></div>`
          );

        const bossCss=`<style id="letter-bay-individual-boss-assets">
          .boss-art,.mini{
            background:none!important;
            background-image:none!important;
            background-size:initial!important;
            background-position:initial!important;
            background-repeat:no-repeat!important;
          }
          .boss-art{
            width:32%!important;
            height:96%!important;
            display:flex!important;
            align-items:flex-end!important;
            justify-content:center!important;
            overflow:visible!important;
          }
          .modal .boss-art{width:180px!important;height:220px!important;margin-inline:auto!important}
          .mini{
            height:42px!important;
            display:flex!important;
            align-items:center!important;
            justify-content:center!important;
            overflow:hidden!important;
          }
          .letter-bay-boss-image{
            display:block!important;
            width:100%!important;
            height:100%!important;
            max-width:100%!important;
            max-height:100%!important;
            object-fit:contain!important;
            object-position:center bottom!important;
            pointer-events:none!important;
            user-select:none!important;
            -webkit-user-drag:none!important;
            filter:drop-shadow(0 8px 8px rgba(0,16,29,.55));
          }
          .mini .letter-bay-boss-image{object-position:center!important;filter:none!important}
        </style>`;

        // Portrait phones should feel like an installed app: one screen, no vertical page scroll.
        // The compact mode reduces vertical chrome by roughly 10–15% while keeping the word,
        // keyboard, HP bars, arena and fleet route visible together. Very short/landscape
        // viewports deliberately fall back to the scrollable legacy layout instead of clipping UI.
        const compactCss=`<style id="letter-bay-compact-mobile">
          @media (max-width:760px) and (min-height:620px) and (max-height:1000px){
            html,body{height:100%!important;min-height:0!important;overflow:hidden!important;overscroll-behavior:none!important}
            .app{
              height:100dvh!important;
              min-height:0!important;
              overflow:hidden!important;
              padding:max(4px,env(safe-area-inset-top)) 6px max(4px,env(safe-area-inset-bottom))!important;
            }
            .wrap{
              width:min(100%,760px)!important;
              height:100%!important;
              min-height:0!important;
              display:grid!important;
              grid-template-rows:auto auto auto clamp(94px,14vh,112px) minmax(0,1fr) 58px!important;
              gap:4px!important;
              align-content:stretch!important;
              overflow:hidden!important;
            }
            header{min-height:34px!important;padding:0 2px 3px!important}
            .avatar{width:34px!important;height:34px!important}
            .brand{gap:6px!important}
            .brand b{font-size:.82rem!important}
            .wallet{gap:4px!important}
            .coin{min-width:40px!important;padding:4px 5px!important;font-size:.76rem!important;border-radius:11px!important}
            .hero{padding:0!important;min-height:0!important}
            .hero .kicker{font-size:.44rem!important;letter-spacing:.14em!important}
            .hero h1{margin:1px 0 0!important;font-size:1.16rem!important;line-height:.98!important}
            .hero p{margin:0!important;font-size:.62rem!important;line-height:1.05!important}
            .bars{position:relative!important;top:auto!important;z-index:5!important;margin:0!important;padding:0!important;gap:4px!important;background:none!important}
            .barbox{padding:4px 6px!important;border-radius:12px!important}
            .barhead{gap:4px!important}
            .barhead small{font-size:.37rem!important}
            .barhead strong,.barvalue{font-size:.70rem!important}
            .track{height:5px!important;margin-top:2px!important}
            .arena{height:auto!important;min-height:0!important;border-radius:15px!important}
            .tula{height:90%!important;width:24%!important}
            .boss-art{height:92%!important;width:28%!important}
            .vs{width:38px!important;height:38px!important;font-size:.82rem!important;border-width:2px!important}
            .panel{
              margin:0!important;
              min-height:0!important;
              overflow:hidden!important;
              padding:6px 7px!important;
              border-radius:15px!important;
              display:grid!important;
              grid-template-rows:auto auto minmax(42px,1fr) auto auto auto auto!important;
              align-content:stretch!important;
              gap:2px!important;
            }
            .meta{gap:4px!important;min-height:0!important}
            .tag{padding:3px 7px!important;font-size:.50rem!important}
            .eyebrow{margin-top:0!important;font-size:.42rem!important;line-height:1!important}
            .panel h2{margin:0!important;font-size:1.02rem!important;line-height:1.04!important}
            .word{min-height:42px!important;margin:1px 0!important;gap:3px!important;align-content:center!important}
            .slot{width:21px!important;height:30px!important;font-size:1.02rem!important;border-bottom-width:2px!important}
            .msg{min-height:14px!important;font-size:.64rem!important;line-height:1.12!important}
            .answer{margin-top:1px!important;gap:4px!important}
            .answer input{min-height:33px!important;padding:5px 8px!important;border-radius:10px!important;font-size:.82rem!important}
            .gold{min-height:33px!important;padding:5px 9px!important;border-radius:10px!important}
            .bonus{font-size:.50rem!important;margin:0 0 1px!important;line-height:1!important}
            .keyboard{grid-template-columns:repeat(9,1fr)!important;gap:3px!important;margin:1px 0!important}
            .key{min-height:31px!important;border-radius:8px!important;font-size:.76rem!important}
            .tools{gap:4px!important;flex-wrap:nowrap!important;min-height:0!important}
            .tool{min-height:29px!important;padding:3px 6px!important;font-size:.56rem!important;white-space:nowrap!important}
            .route{
              margin:0!important;
              min-height:0!important;
              padding:4px 5px!important;
              border-radius:12px!important;
              overflow:hidden!important;
              display:grid!important;
              grid-template-columns:76px minmax(0,1fr)!important;
              align-items:center!important;
              gap:4px!important;
            }
            .route h3{margin:0!important;font-size:.60rem!important;line-height:1.05!important}
            .bosses{height:48px!important;gap:4px!important;padding:0!important;align-items:stretch!important}
            .boss-card{
              flex:0 0 52px!important;
              min-width:52px!important;
              padding:2px!important;
              border-radius:9px!important;
              display:grid!important;
              grid-template-rows:22px auto auto!important;
              align-content:center!important;
            }
            .mini{height:22px!important;margin:0!important}
            .boss-card small{font-size:.29rem!important;line-height:1!important}
            .boss-card b{font-size:.33rem!important;line-height:1!important}
            .cheer{top:10%!important}
          }
          @media (max-width:380px) and (min-height:620px) and (max-height:760px){
            .hero p{display:none!important}
            .wrap{grid-template-rows:auto auto auto 90px minmax(0,1fr) 54px!important}
            .route{grid-template-columns:68px minmax(0,1fr)!important}
            .route h3{font-size:.55rem!important}
            .key{min-height:29px!important}
            .word{min-height:38px!important}
            .slot{height:27px!important}
          }
        </style>`;

        const runtimeFix=`<script id="letter-bay-runtime-fix">(()=>{
          const VERSION='${VERSION}';
          const BOSS_FILES=[
            'level-01-pirat-kai.png',
            'level-02-kapitaen-brax.png',
            'level-03-blackfinn.png',
            'level-04-alt-kapitaen-roderick.png',
            'level-05-piratenbaron-vargas.png',
            'level-06-kapitaen-ironhook.png',
            'level-07-admiral-thorne.png',
            'level-08-kartenmeister-corvin.png',
            'level-09-schattenfuerst-azrak.png',
            'level-10-piratenkoenig-varkos.png'
          ];
          const BOSS_NAMES=['Pirat Kai','Kapitän Brax','Blackfinn','Alt-Kapitän Roderick','Piratenbaron Vargas','Kapitän Ironhook','Admiral Thorne','Kartenmeister Corvin','Schattenfürst Azrak','Piratenkönig Varkos'];
          const bossUrl=index=>new URL('assets/bosses/'+BOSS_FILES[index],document.baseURI).href+'?v='+VERSION;
          const setBoss=(element,index)=>{
            if(!element)return;
            const safeIndex=Math.max(0,Math.min(BOSS_FILES.length-1,index));
            let image=element.querySelector('.letter-bay-boss-image');
            if(!image){
              image=document.createElement('img');
              image.className='letter-bay-boss-image';
              image.decoding='async';
              image.loading=element.classList.contains('mini')?'lazy':'eager';
              element.replaceChildren(image);
            }
            const src=bossUrl(safeIndex);
            if(image.src!==src)image.src=src;
            image.alt=BOSS_NAMES[safeIndex];
            image.dataset.bossIndex=String(safeIndex+1);
            image.onerror=()=>{
              console.error('[Letter Bay] Boss image failed:',src);
              image.alt=BOSS_NAMES[safeIndex]+' – Grafik konnte nicht geladen werden';
            };
          };
          const currentBossIndex=()=>{
            const levelText=document.getElementById('bossLevel')?.textContent||'';
            const match=levelText.match(/LEVEL\\s+(\\d+)/i);
            if(match)return Math.max(0,Math.min(9,Number(match[1])-1));
            const name=(document.getElementById('bossName')?.textContent||'').trim();
            const found=BOSS_NAMES.indexOf(name);
            return found<0?0:found;
          };
          let syncing=false;
          const syncBosses=()=>{
            if(syncing)return;
            syncing=true;
            const current=currentBossIndex();
            setBoss(document.getElementById('bossArt'),current);
            setBoss(document.getElementById('introArt'),current);
            document.querySelectorAll('#route .boss-card .mini').forEach((element,index)=>setBoss(element,index));
            syncing=false;
          };
          const keepTop=()=>{
            window.scrollTo(0,0);
            document.documentElement.scrollTop=0;
            document.body.scrollTop=0;
          };
          const start=document.getElementById('start');
          if(start){
            start.addEventListener('click',()=>{keepTop();requestAnimationFrame(keepTop);setTimeout(keepTop,80);setTimeout(keepTop,250)},true);
            start.addEventListener('touchend',()=>{keepTop();requestAnimationFrame(keepTop);setTimeout(keepTop,80);setTimeout(keepTop,250)},{capture:true,passive:true});
          }
          const observer=new MutationObserver(()=>requestAnimationFrame(syncBosses));
          observer.observe(document.body,{subtree:true,childList:true,characterData:true});
          syncBosses();
          requestAnimationFrame(syncBosses);
          setTimeout(syncBosses,100);
          setTimeout(syncBosses,500);
          [0,1].forEach(index=>{const image=new Image();image.src=bossUrl(index)});
        })();<\/script>`;

        html=html.replace('</head>',bossCss+compactCss+'</head>').replace('</body>',runtimeFix+'</body>');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error('[Letter Bay] Bootstrap failed',error);
        document.body.innerHTML='<main style="min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center;background:#021a2e;color:#fff8e8"><div><h1>Letter Bay</h1><p>Das Spiel konnte gerade nicht geladen werden.</p><button onclick="location.reload()" style="padding:12px 18px;border-radius:12px">Erneut laden</button></div></main>';
      }
    })();
  </script>
</body>
</html>
