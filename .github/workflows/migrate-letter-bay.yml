name: Import Letter Bay runtime from pinned Tula source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned game and shared runtime assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/o-some/tulasisland/892f676fbcef77ab49373aef7865d60afba0ebb7'
          mkdir -p assets/creative assets/creative-v2
          curl -fL "$BASE/public/letter-bay/index.html" -o index.legacy.html
          curl -fL "$BASE/public/letter-bay/source.html" -o source.legacy.html
          curl -fL "$BASE/assets/creative/tula_profile.webp" -o assets/creative/tula_profile.webp
          curl -fL "$BASE/assets/creative/tula_waving.webp" -o assets/creative/tula_waving.webp
          curl -fL "$BASE/assets/creative/world_harbor.webp" -o assets/creative/world_harbor.webp
          curl -fL "$BASE/assets/creative-v2/home_cinematic_island.webp" -o assets/creative-v2/home_cinematic_island.webp
      - name: Commit imported reference files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.legacy.html source.legacy.html assets/creative assets/creative-v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh pinned Letter Bay reference runtime'
          git push
