name: Import Letter Bay from pinned Tula source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-letter-bay.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned game and assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/o-some/tulasisland/892f676fbcef77ab49373aef7865d60afba0ebb7'
          mkdir -p assets/creative assets/creative-v2
          curl -fL "$BASE/public/letter-bay/index.html" -o index.html
          curl -fL "$BASE/public/letter-bay/source.html" -o source.html
          curl -fL "$BASE/public/letter-bay/boss-sprite-dropbox-v2.webp" -o boss-sprite-dropbox-v2.webp
          curl -fL "$BASE/assets/creative/tula_profile.webp" -o assets/creative/tula_profile.webp
          curl -fL "$BASE/assets/creative/tula_waving.webp" -o assets/creative/tula_waving.webp
          curl -fL "$BASE/assets/creative/world_harbor.webp" -o assets/creative/world_harbor.webp
          curl -fL "$BASE/assets/creative-v2/home_cinematic_island.webp" -o assets/creative-v2/home_cinematic_island.webp
          python3 - <<'PY'
          from pathlib import Path

          # Normalize all runtime paths for the standalone letter-bay repository.
          for filename in ('index.html', 'source.html'):
              p = Path(filename)
              s = p.read_text()
              s = s.replace('/tulasisland/letter-bay/boss-sprite-dropbox-v2.webp', 'boss-sprite-dropbox-v2.webp')
              s = s.replace('/tulasisland/letter-bay/boss-sprite.avif', 'boss-sprite-dropbox-v2.webp')
              s = s.replace('boss-sprite.avif', 'boss-sprite-dropbox-v2.webp')
              s = s.replace('../assets/creative-v2/home_cinematic_island.webp', 'assets/creative-v2/home_cinematic_island.webp')
              s = s.replace('../assets/creative/tula_profile.webp', 'assets/creative/tula_profile.webp')
              s = s.replace('../assets/creative/tula_waving.webp', 'assets/creative/tula_waving.webp')
              s = s.replace('../assets/creative/world_harbor.webp', 'assets/creative/world_harbor.webp')
              p.write_text(s)
          PY
          rm -f MIGRATION_TEST.txt
      - name: Commit imported runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html source.html boss-sprite-dropbox-v2.webp assets README.md HANDOFF.md docs .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Letter Bay boss graphics paths'
          git push
