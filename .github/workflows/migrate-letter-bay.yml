name: One-time import of verified Letter Bay boss assets

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import-bosses:
    if: startsWith(github.head_ref, 'chore/trigger-boss-import')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download ten original transparent Dropbox bosses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/bosses
          curl -fL --retry 3 'https://uca3051226bb845f61ec70a6aa5c.dl.dropboxusercontent.com/cd/0/get/DGidZ_gQtUMpE_FA92WeyInoZZqFIdksSMbAsl20XY1_uvcieRqqt02rFD0excarSWlZAxEdh7IN-5T03NpPlGdtfIBwe35FCIZifDsmiWlBAwHQylsPKAbiZz9MYheNiJrAySXB55kvzJrInKFdmn4KyRDn5AHIeNtFBz9PDUpuGA/file?c_luid=88361d58' -o assets/bosses/level-01-pirat-kai.png
