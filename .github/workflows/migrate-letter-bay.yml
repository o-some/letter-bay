      - name: Verify PNG signatures, dimensions and alpha channels
        shell: python
        run: |
          from pathlib import Path
          import struct
          files=sorted(Path('assets/bosses').glob('level-*.png'))
          assert len(files)==10, f'Expected 10 files, found {len(files)}'
          for p in files:
              data=p.read_bytes()
              assert len(data)>100_000, f'{p}: too small'
              assert data[:8]==b'\x89PNG\r\n\x1a\n', f'{p}: invalid PNG signature'
              width,height=struct.unpack('>II',data[16:24])
              colour_type=data[25]
              assert width>300 and height>300, f'{p}: invalid dimensions {width}x{height}'
              assert colour_type in (4,6), f'{p}: no alpha channel, colour type {colour_type}'
              print(p, width, height, len(data))
      - name: Commit verified files directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/bosses
          git commit -m 'Add ten verified individual Letter Bay bosses'
          git push origin HEAD:main
