name: Deploy Letter Bay to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode boss sprite when stored as Base64 text
        shell: bash
        run: |
          set -euo pipefail
          if [ -f boss-sprite-dropbox-v2.webp ] && grep -q '^UklGR' boss-sprite-dropbox-v2.webp; then
            base64 -d boss-sprite-dropbox-v2.webp > /tmp/boss-sprite-dropbox-v2.webp
            mv /tmp/boss-sprite-dropbox-v2.webp boss-sprite-dropbox-v2.webp
          fi
          file boss-sprite-dropbox-v2.webp
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
