name: Deploy Letter Bay to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployable Letter Bay assets
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s source.html
          test -d assets
          if [ -d assets/bosses ]; then
            test "$(find assets/bosses -maxdepth 1 -type f -name 'level-*.png' | wc -l)" -eq 10
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
