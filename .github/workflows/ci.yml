name: Letter Bay V2 CI

on:
  push:
    branches:
      - feature/letter-bay-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.0'

      - name: Generate lockfile if Phase 1 is the first dependency commit
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install reproducibly
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Legacy contract
        run: npm run test:baseline

      - name: Build
        run: npm run build

      - name: Asset integrity
        run: npm run test:assets

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: E2E compatibility and Boss 1 to Boss 2
        run: npm run test:e2e

      - name: Persist generated package-lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/letter-bay-v2'
        run: |
          if ! git diff --quiet -- package-lock.json || [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: lock Letter Bay V2 dependencies'
            git push
          fi
